spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&allowPublicKeyRetrieval=false&createDatabaseIfNotExist=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
server.forward-headers-strategy=framework

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.secret=${jwt.secret}
app.jwt.expiration=${jwt.expiration}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

app.data.seed-demo=false
app.data.drop-legacy-tables=false

bank.accountNo=${BANK_ACCOUNT_NO}
bank.accountName=${BANK_ACCOUNT_NAME}
bank.bankCode=${BANK_BANK_CODE}

payos.endpoint=${PAYOS_ENDPOINT:https://api-merchant.payos.vn/v2/payment-requests}
payos.clientId=${PAYOS_CLIENT_ID}
payos.apiKey=${PAYOS_API_KEY}
payos.checksumKey=${PAYOS_CHECKSUM_KEY}
payos.returnUrl=${PAYOS_RETURN_URL}
payos.cancelUrl=${PAYOS_CANCEL_URL}

resend.api-key=${RESEND_API_KEY}
resend.from-email=${RESEND_FROM_EMAIL}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
app.frontend.oauth-success-url=${FRONTEND_OAUTH_SUCCESS_URL}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}
cloudinary.folder=${CLOUDINARY_FOLDER:thichdulich}
app.upload.max-image-size-bytes=${MAX_IMAGE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

logging.level.root=INFO
logging.level.com.example.thichdulich=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
