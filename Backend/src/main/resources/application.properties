spring.application.name=thichdulich

# ===============================
# Máy chủ
# ===============================
server.port=8080
server.servlet.context-path=/
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# ===============================
# Cơ sở dữ liệu MySQL
# ===============================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:thichdulich}?useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ===============================
# Bảo mật JWT và CORS
# ===============================
jwt.secret=${JWT_SECRET:devOnlyJwtSecretChangeMeDevOnlyJwtSecretChangeMeDevOnlyJwtSecretChangeMe}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.secret=${jwt.secret}
app.jwt.expiration=${jwt.expiration}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Email OTP qua Resend. Giá trị mặc định chỉ dùng để test cục bộ; khi deploy hãy ghi đè bằng RESEND_API_KEY.
resend.api-key=${RESEND_API_KEY:}
resend.from-email=${RESEND_FROM_EMAIL:noreply@send.thichdulich.me}

# Đăng nhập Google OAuth2. Lấy Client ID và Client Secret từ Google Cloud Console.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
app.frontend.oauth-success-url=${FRONTEND_OAUTH_SUCCESS_URL:http://localhost:5173/oauth2/success}

# ===============================
# Ghi log
# ===============================
logging.level.root=INFO
logging.level.com.example.thichdulich=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ===============================
# JSON / Jackson
# ===============================
spring.jackson.default-property-inclusion=non_null
spring.jackson.time-zone=UTC

# ===============================
# Thông tin ứng dụng
# ===============================
app.name=ThichDulich Tour Booking
app.version=1.0.0

# Tắt mặc định dữ liệu demo để tránh sửa cơ sở dữ liệu thật khi khởi động.
app.data.seed-demo=${APP_DATA_SEED_DEMO:false}
app.data.drop-legacy-tables=${APP_DATA_DROP_LEGACY_TABLES:false}

# ===============================
# AI / Gemini
# ===============================
app.ai.gemini.api-key=${GEMINI_API_KEY:}
app.ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
app.ai.gemini.endpoint=https://generativelanguage.googleapis.com/v1beta/models

# ===============================
# Thanh toán
# ===============================
# Thông tin tài khoản hiển thị khi chuyển khoản QR.
bank.accountNo=${BANK_ACCOUNT_NO:}
bank.accountName=${BANK_ACCOUNT_NAME:}
bank.bankCode=${BANK_BANK_CODE:}

# Thông tin payOS để tạo link thanh toán QR và xử lý webhook.
payos.endpoint=${PAYOS_ENDPOINT:https://api-merchant.payos.vn/v2/payment-requests}
payos.clientId=${PAYOS_CLIENT_ID:}
payos.apiKey=${PAYOS_API_KEY:}
payos.checksumKey=${PAYOS_CHECKSUM_KEY:}
payos.returnUrl=${PAYOS_RETURN_URL:http://localhost:5173/bookings}
payos.cancelUrl=${PAYOS_CANCEL_URL:http://localhost:5173/bookings}

# ===============================
# Upload ảnh / Cloudinary
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.folder=${CLOUDINARY_FOLDER:thichdulich}
app.upload.max-image-size-bytes=${MAX_IMAGE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB
